<div class="card shadow">
  <div class="card-header bg-info text-white d-flex justify-content-between align-items-center">
    <h5 class="mb-0"><i class="bi bi-play-circle me-2"></i>Video Player</h5>
    
    <!-- Player Seçici -->
    <div class="player-selector">
      <div class="btn-group btn-group-sm" role="group">
        <button type="button" 
                class="btn btn-outline-light" 
                [class.active]="selectedPlayer === 'native'"
                (click)="selectPlayer('native')"
                [disabled]="!currentVideo">
          <i class="bi bi-display me-1"></i> Native
        </button>
        <button type="button" 
                class="btn btn-outline-light" 
                [class.active]="selectedPlayer === 'plyr'"
                (click)="selectPlayer('plyr')"
                [disabled]="!currentVideo">
          <i class="bi bi-play-btn me-1"></i> Plyr
        </button>
      </div>
    </div>
  </div>
  
  <div class="card-body text-center">
    <div *ngIf="!currentVideo" class="alert alert-info">
      <i class="bi bi-info-circle me-2"></i>Please upload a video first to see the player
    </div>

    <div *ngIf="currentVideo" class="video-player-wrapper">
      <!-- CHROME OPTIMIZED NATIVE PLAYER -->
      <div *ngIf="selectedPlayer === 'native'" class="native-player-container">
        <div class="video-embed-container">
          <video #videoPlayer 
                 controls 
                 controlsList="nodownload"
                 width="100%" 
                 class="video-element"
                 (click)="onVideoClick()"
                 (play)="onVideoPlay()"
                 crossorigin="anonymous"
                 playsinline
                 preload="auto">
            <source [src]="videoSrc" type="video/mp4">
            Your browser does not support HTML5 video.
          </video>
        </div>
        
        <!-- Loading indicator -->
        <div *ngIf="!isPlayerReady && selectedPlayer === 'native'" class="player-loading-overlay">
          <div class="spinner-border text-light" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
        </div>
      </div>

      <!-- PLYR PLAYER - DÜZELTİLDİ -->
      <div *ngIf="selectedPlayer === 'plyr'" class="plyr-player-container">
        <!-- Plyr container - DOĞRU YAPI -->
        <div #plyrPlayer class="plyr__video-embed plyr-container" id="plyr-player">
          <!-- Plyr video element'ini buraya inject edecek -->
        </div>
        
        <div *ngIf="!plyrInitialized && selectedPlayer === 'plyr'" class="player-loading-overlay">
          <div class="spinner-border text-light" role="status">
            <span class="visually-hidden">Loading Plyr...</span>
          </div>
          <div class="mt-2 text-light">Initializing Plyr player...</div>
        </div>
      </div>
      
    </div>

    <!-- Controls - SIMPLIFIED -->
    <div *ngIf="currentVideo" class="controls-container mt-3">
      <!-- Simple Time Navigation -->
      <div class="simple-navigation mb-3">

        <!-- <div class="d-flex justify-content-between align-items-center mb-2">
          <small class="text-muted">
            <i class="bi bi-play-btn me-1"></i>
            <strong>{{selectedPlayer === 'native' ? 'Native' : 'Plyr'}}</strong>
            <span class="mx-2">•</span>
            <i class="bi bi-clock me-1"></i>
            {{currentTime | number:'1.0-0'}}s / {{currentVideo?.duration || 0 | number:'1.0-0'}}s
          </small>
          
          <div class="btn-group btn-group-sm">
            <button class="btn btn-outline-secondary" 
                    (click)="selectPlayer('native')"
                    [class.active]="selectedPlayer === 'native'"
                    title="Switch to Native Player">
              <i class="bi bi-display"></i>
            </button>
            <button class="btn btn-outline-secondary" 
                    (click)="selectPlayer('plyr')"
                    [class.active]="selectedPlayer === 'plyr'"
                    title="Switch to Plyr Player">
              <i class="bi bi-play-btn"></i>
            </button>
          </div>
        </div> -->

        <!-- Quick Actions -->
        <div class="quick-actions mb-3">
          <div class="btn-group w-100" role="group">
            <button class="btn btn-outline-primary btn-sm" 
                    (click)="skipBackward(15)"
                    [disabled]="!isPlayerReady"
                    title="15 seconds back">
              <i class="bi bi-rewind"></i> 15s
            </button>
            <button class="btn btn-outline-primary btn-sm" 
                    (click)="skipBackward(5)"
                    [disabled]="!isPlayerReady"
                    title="5 seconds back">
              <i class="bi bi-skip-backward"></i> 5s
            </button>
            <button class="btn btn-primary btn-sm" 
                    (click)="togglePlay()"
                    [disabled]="!isPlayerReady"
                    title="Play/Pause">
              <i class="bi bi-play-fill" *ngIf="isPaused"></i>
              <i class="bi bi-pause-fill" *ngIf="!isPaused"></i>
            </button>
            <button class="btn btn-outline-primary btn-sm" 
                    (click)="skipForward(5)"
                    [disabled]="!isPlayerReady"
                    title="5 seconds forward">
              5s <i class="bi bi-skip-forward"></i>
            </button>
            <button class="btn btn-outline-primary btn-sm" 
                    (click)="skipForward(15)"
                    [disabled]="!isPlayerReady"
                    title="15 seconds forward">
              15s <i class="bi bi-fast-forward"></i>
            </button>
          </div>
        </div>

        <!-- Quick Time Jumps -->
        <div class="quick-jumps">
          <small class="text-muted d-block mb-2">Jump to:</small>
          <div class="btn-group w-100" role="group">
            <button class="btn btn-outline-secondary btn-sm" 
                    (click)="setCurrentTime(0)"
                    [disabled]="!isPlayerReady">
              0:00
            </button>
            <button class="btn btn-outline-secondary btn-sm" 
                    (click)="setCurrentTime(30)"
                    [disabled]="!isPlayerReady">
              0:30
            </button>
            <button class="btn btn-outline-secondary btn-sm" 
                    (click)="setCurrentTime(60)"
                    [disabled]="!isPlayerReady">
              1:00
            </button>
            <button class="btn btn-outline-secondary btn-sm" 
                    (click)="setCurrentTime(120)"
                    [disabled]="!isPlayerReady">
              2:00
            </button>
            <button class="btn btn-outline-primary btn-sm" 
                    (click)="goToMiddle()"
                    [disabled]="!isPlayerReady">
              <i class="bi bi-symmetry-vertical"></i> Mid
            </button>
          </div>
        </div>
      </div>

      <!-- User Interaction Prompt -->
      <div *ngIf="!userInteracted && isPlayerReady" class="alert alert-info alert-sm py-1 mb-0">
        <small>
          <i class="bi bi-info-circle me-1"></i>
          Click the video to enable playback controls
        </small>
      </div>
    </div>
  </div>
</div>
