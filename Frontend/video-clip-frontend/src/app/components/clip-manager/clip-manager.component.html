<div class="card shadow">
  <div class="card-header bg-success text-white d-flex justify-content-between align-items-center">
    <h5 class="mb-0"><i class="bi bi-collection me-2"></i>Saved Clips</h5>
    <button class="btn btn-sm btn-light" (click)="loadClips()" [disabled]="isLoading">
      <i class="bi bi-arrow-clockwise"></i>
    </button>
  </div>
  <div class="card-body">
    <div *ngIf="isLoading" class="text-center">
      <div class="spinner-border text-success" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>

    <div *ngIf="!isLoading && clips.length === 0" class="alert alert-info">
      <i class="bi bi-info-circle me-2"></i>No saved clips yet. Create and save your first clip!
    </div>

    <div *ngIf="errorMessage" class="alert alert-danger mt-2">
  <i class="bi bi-exclamation-octagon me-2"></i> {{ errorMessage }}
</div>

<div *ngIf="clips.length > 0" class="list-group list-group-flush">
  <div *ngFor="let clip of clips" class="list-group-item px-2">
    <div class="d-flex align-items-center w-100">
      
      <div class="flex-grow-1 min-width-0">
        <h6 class="mb-1 text-truncate" [title]="clip.name">{{ clip.name }}</h6>
        
        <div class="small text-muted">
          <div class="text-truncate">
            <i class="bi bi-film me-1"></i>{{ clip.source_video }}
          </div>
          <div>
            <i class="bi bi-clock me-1"></i>{{ clip.start_time | number:'1.1-1' }}s - {{ clip.end_time | number:'1.1-1' }}s
          </div>
          <div class="text-nowrap" style="font-size: 0.75rem;">
            <i class="bi bi-calendar me-1"></i>{{ formatDate(clip.created_at) }}
          </div>
        </div>
      </div>

      <div class="ms-2 flex-shrink-0">
        <div class="btn-group-vertical btn-group-sm"> <button class="btn btn-outline-primary border-0" (click)="downloadSavedClip(clip)" title="Download">
            <i class="bi bi-download"></i>
          </button>
          <button class="btn btn-outline-danger border-0" (click)="deleteClip(clip.id)" title="Delete">
            <i class="bi bi-trash"></i>
          </button>
        </div>
      </div>

    </div>
  </div>
</div>
  </div>
</div>
